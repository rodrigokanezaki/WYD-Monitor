<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WYD • Consulta</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#071728;color:#e4eef8}body{margin:0;padding:18px;max-width:1000px;margin:auto}h1{font-size:23px;margin:0}h2{font-size:18px}p{margin:7px 0;color:#afc4d8}header{display:flex;justify-content:space-between;align-items:center;gap:12px}button,input{font:inherit;background:#12324c;color:inherit;border:1px solid #377da7;border-radius:9px;padding:10px}button{cursor:pointer}input{box-sizing:border-box;width:100%;margin:10px 0}#connection{padding:12px;border-radius:8px;background:#102d44}.bad{color:#ffc78a!important;background:#492d1d!important}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.box,.char,.result{border:1px solid #285d81;border-radius:12px;background:#0e2941;padding:14px}.box strong{font-size:23px;color:#ffe36a;display:block;overflow-wrap:anywhere}.box.wide{grid-column:1/-1}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.char{margin-bottom:10px}.char h3{font-size:17px;color:#ffe36a;margin:0 0 8px}.char p,.result p{font-size:14px;overflow-wrap:anywhere}.map{color:orange}.online{color:#6fe1b2}.old{color:#f9bb7a}details{margin-top:10px}summary{cursor:pointer}ul{padding-left:20px}#results{display:grid;gap:8px}small{color:#abc2d5}@media(max-width:620px){.columns{grid-template-columns:1fr}body{padding:12px}.box strong{font-size:21px}}
</style><header><div><h1>WYD MONITOR</h1><p>Consulta pelo celular</p></div><button id="refresh">Atualizar</button></header>
<p id="connection" role="status">Conectando ao notebook…</p>
<div class="stats"><div class="box"><strong id="chars">—</strong>Personagens</div><div class="box"><strong id="online">—</strong>Online na última leitura</div><div class="box wide"><strong id="total">—</strong><span id="coverage"></span></div></div>
<details><summary>Avisos da Fada</summary><small>Consulta dos avisos do monitor. Não envia notificações com o navegador fechado.</small><ul id="alerts"></ul></details>
<h2>Pesquisa global</h2><input id="search" placeholder="Nome ou ID do item — exemplo: lac" aria-label="Pesquisar itens"><div id="results"></div>
<div class="columns"><section><h2>Exordion-1</h2><div id="sv1"></div></section><section><h2>Exordion-2</h2><div id="sv2"></div></section></div><section id="unknownSection"><h2>Outros / servidor não identificado</h2><div id="unknown"></div></section>
<script>
let data=null,busy=false,failed=false;const $=id=>document.getElementById(id);const fmt=n=>n==null?'Não confirmado':Number(n).toLocaleString('pt-BR');
function rate(v){return v==null?'Coletando':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1})}
function node(tag,text,cls){let n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function stale(){return !data?.updatedAt||Date.now()-Date.parse(data.updatedAt)>15000||failed}
function freshness(){let old=stale();$('connection').className=old?'bad':'';$('connection').textContent=failed?'Sem conexão com o notebook. Os dados abaixo são anteriores.':old?'Dados desatualizados. Verifique o monitor e a conexão do notebook.':'Atualizado em '+new Date(data.updatedAt).toLocaleTimeString('pt-BR');$('total').style.opacity=old?'.6':'1'}
function render(){if(!data)return;$('chars').textContent=data.characters.length;$('online').textContent=data.characters.filter(c=>c.status==='Online').length;$('total').textContent=data.total;$('coverage').textContent=data.coverage;
for(let id of ['sv1','sv2','unknown','alerts'])$(id).replaceChildren();
for(let c of data.characters){let el=node('article','', 'char');el.append(node('h3',c.name+([c.counters?.inventoryAlert,c.counters?.xpAlert].filter(Boolean).length?' '+[c.counters?.inventoryAlert,c.counters?.xpAlert].filter(Boolean).join(' | '):''),(c.counters?.inventoryAlert||c.counters?.xpAlert)?'old':''),node('p','HP: '+fmt(c.hp)+' / '+fmt(c.maxHP)),node('p',c.status+' • Level '+c.level,c.status==='Online'?'online':'old'),node('p',c.map+' • '+c.x+', '+c.y,'map'),node('p','Fada: '+c.fairy),node('p','Gold: '+fmt(c.gold)+' • Baú: '+fmt(c.chestGold)),node('p','Moedas: mochila '+fmt(c.coins)+' / baú '+fmt(c.chestCoins)),node('small',(c.fresh?'Leitura atual':'Leitura parcial ou anterior')+' • '+c.lastSeen));$(c.server==='Exordion-1'?'sv1':c.server==='Exordion-2'?'sv2':'unknown').append(el)}
$('unknownSection').hidden=!$('unknown').children.length;for(let a of data.alerts)$('alerts').append(node('li',a));search();freshness()}
function search(){let q=$('search').value.trim().toLocaleLowerCase('pt-BR');$('results').replaceChildren();if(!q||!data)return;let count=0;
for(let c of data.characters){let groups=new Map;for(let i of c.items){if(!i.name.toLocaleLowerCase('pt-BR').includes(q)&&String(i.id)!==q)continue;let key=i.area+':'+i.id;let a=groups.get(key)||{name:i.name,id:i.id,area:i.area,quantity:0,known:true,slots:[]};if(i.quantity==null)a.known=false;else a.quantity+=i.quantity;a.slots.push(i.slot);groups.set(key,a)}for(let i of groups.values()){count++;let el=node('article','','result');el.append(node('strong',c.name+' • '+i.name),node('p','Quantidade: '+(i.known?fmt(i.quantity):'Não confirmada')+' • '+i.area+' • ID '+i.id),node('small','Slots: '+i.slots.join(', ')+(c.inventoryFresh&&!stale()?'':' • Dados anteriores/não confirmados')));$('results').append(el)}}if(!count)$('results').append(node('p','Nenhum item encontrado nas leituras disponíveis.'))}
async function refresh(){if(busy)return;busy=true;try{let r=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error(r.status);data=await r.json();failed=false;render()}catch(e){failed=true;freshness();search()}finally{busy=false}}
$('refresh').onclick=refresh;$('search').oninput=search;setInterval(refresh,5000);setInterval(freshness,1000);refresh();
</script></html>
